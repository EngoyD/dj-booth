  Keys:  F fullscreen · Space play/pause · left/right prev/next · A audio input · C cycle camera
-->

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================== CONFIG ============================== */
const CONFIG = {
  SPOTIFY_CLIENT_ID: '21e1242fd5504931af52031eeed0fbff',
  REDIRECT_URI: location.origin + location.pathname,
  SCOPES: 'user-read-currently-playing user-read-playback-state user-modify-playback-state',
  POLL_MS: 3000, POLL_IDLE_MS: 10000, BAND_SMOOTH_S: 0.10,
};

/* ============================== UTILS ============================== */
const ls = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} },
};
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const clamp01 = v => clamp(v,0,1);
const lerp = (a,b,t) => a+(b-a)*t;
const rand = (a,b) => a+Math.random()*(b-a);
function b64url(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
let msg = '', msgUntil = 0;
function setMsg(t){ msg = t; msgUntil = performance.now()+3200; }
function openSetup(){
  document.getElementById('ruri').textContent = CONFIG.REDIRECT_URI;
  document.getElementById('inClient').value = ls.get('rw.cid') || '';
  document.getElementById('setup').style.display = 'grid';
}
const scene2 = { flash: 0, spin: 0 };
/* ============================== SPOTIFY AUTH (PKCE) ============================== */
function getClientId() { return (ls.get('rw.cid') || CONFIG.SPOTIFY_CLIENT_ID || '').trim(); }
function hasTok() { return !!(ls.get('rw.rt') || ls.get('rw.at')); }
function clearAuth() { ['rw.at', 'rw.rt', 'rw.exp', 'rw.ver'].forEach(ls.del); }

async function beginAuth() {
  const cid = getClientId();
  if (!cid) { openSetup(); return; }
  const bytes = crypto.getRandomValues(new Uint8Array(64));
  const verifier = b64url(bytes);
  ls.set('rw.ver', verifier);
  const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
  const params = new URLSearchParams({
    client_id: cid, response_type: 'code', redirect_uri: CONFIG.REDIRECT_URI,
    code_challenge_method: 'S256', code_challenge: b64url(digest), scope: CONFIG.SCOPES,
  });
  location.assign('https://accounts.spotify.com/authorize?' + params);
}

async function handleRedirect() {
  const q = new URLSearchParams(location.search);
  const code = q.get('code'), err = q.get('error');
  if (err) { setMsg('Spotify: ' + err); history.replaceState({}, '', CONFIG.REDIRECT_URI); return; }
  if (!code) return;
  const verifier = ls.get('rw.ver');
  history.replaceState({}, '', CONFIG.REDIRECT_URI);
  if (!verifier) return;
  try {
    const r = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        grant_type: 'authorization_code', code, redirect_uri: CONFIG.REDIRECT_URI,
        client_id: getClientId(), code_verifier: verifier,
      }),
    });
    const j = await r.json();
    if (j.access_token) storeTok(j); else setMsg('Auth failed: ' + (j.error_description || j.error || '?'));
  } catch (e) { setMsg('Auth error'); }
  ls.del('rw.ver');
}

function storeTok(j) {
  ls.set('rw.at', j.access_token);
  if (j.refresh_token) ls.set('rw.rt', j.refresh_token);
  ls.set('rw.exp', String(Date.now() + (j.expires_in || 3600) * 1000 - 60000));
}

async function refreshTok() {
  const rt = ls.get('rw.rt');
  if (!rt) return false;
  try {
    const r = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ grant_type: 'refresh_token', refresh_token: rt, client_id: getClientId() }),
    });
    const j = await r.json();
    if (j.access_token) { storeTok(j); return true; }
  } catch (e) {}
  return false;
}

async function tok() {
  const exp = Number(ls.get('rw.exp') || 0);
  if (ls.get('rw.at') && Date.now() < exp) return ls.get('rw.at');
  if (await refreshTok()) return ls.get('rw.at');
  return ls.get('rw.at');
}

async function api(path, opts) {
  const t = await tok();
  if (!t) return { status: 401 };
  const r = await fetch('https://api.spotify.com/v1' + path, {
    ...opts, headers: { ...(opts && opts.headers), Authorization: 'Bearer ' + t },
  });
  return r;
}

/* ============================== PLAYBACK ============================== */
const playback = {
  trackId: '', title: '', artist: '', isPlaying: false,
  progressMs: 0, durationMs: 0, fetchedAt: 0, artUrl: '',
};
let pollTimer = 0, backoff = 1;

function estProgress() {
  if (!playback.isPlaying) return playback.progressMs;
  return playback.progressMs + (performance.now() - playback.fetchedAt);
}

function onPlayback(j) {
  if (!j || !j.item) { playback.isPlaying = !!(j && j.is_playing); playback.fetchedAt = performance.now(); return; }
  const id = j.item.id || j.item.uri;
  const changed = id !== playback.trackId;
  playback.trackId = id;
  playback.title = j.item.name || '';
  playback.artist = (j.item.artists || []).map(a => a.name).join(', ');
  playback.isPlaying = !!j.is_playing;
  playback.progressMs = j.progress_ms || 0;
  playback.durationMs = j.item.duration_ms || 0;
  playback.fetchedAt = performance.now();
  const imgs = (j.item.album && j.item.album.images) || [];
  const url = imgs.length ? imgs[Math.min(1, imgs.length - 1)].url : '';
  if (changed) { scene2.flash = 1; }
  if (changed && url !== playback.artUrl) { playback.artUrl = url; loadArt(url); }
  if (changed && !url) { playback.artUrl = ''; art.img = null; art.rgb = null; }
}

async function poll() {
  if (demo.on && !hasTok()) return schedulePoll(CONFIG.POLL_MS);
  if (!hasTok()) return schedulePoll(CONFIG.POLL_IDLE_MS);
  try {
    const r = await api('/me/player/currently-playing?additional_types=track');
    if (r.status === 204) { playback.isPlaying = false; backoff = 1; return schedulePoll(CONFIG.POLL_IDLE_MS); }
    if (r.status === 401) { if (await refreshTok()) return schedulePoll(400); clearAuth(); return schedulePoll(CONFIG.POLL_IDLE_MS); }
    if (r.status === 429) {
      const wait = Number(r.headers.get('retry-after') || 5);
      return schedulePoll(clamp(wait * 1000, 1000, 60000));
    }
    if (!r.ok) { backoff = Math.min(backoff * 2, 16); return schedulePoll(CONFIG.POLL_MS * backoff); }
    backoff = 1;
    onPlayback(await r.json());
    schedulePoll(playback.isPlaying ? CONFIG.POLL_MS : CONFIG.POLL_IDLE_MS);
  } catch (e) {
    backoff = Math.min(backoff * 2, 16);
    schedulePoll(CONFIG.POLL_MS * backoff);
  }
}
function schedulePoll(ms) { clearTimeout(pollTimer); pollTimer = setTimeout(poll, ms); }

async function transport(cmd) {
  if (!hasTok()) { setMsg('Connect Spotify first'); return; }
  const map = { play: ['PUT', '/me/player/play'], pause: ['PUT', '/me/player/pause'],
                next: ['POST', '/me/player/next'], prev: ['POST', '/me/player/previous'] };
  const m = map[cmd === 'toggle' ? (playback.isPlaying ? 'pause' : 'play') : cmd];
  if (!m) return;
  try {
    let r = await api(m[1], { method: m[0] });
    if (r.status === 401 && await refreshTok()) r = await api(m[1], { method: m[0] });
    if (r.status === 403) { setMsg('Spotify Premium required'); return; }
    if (r.status === 404) { setMsg('No active Spotify device'); return; }
    if (cmd === 'toggle' || cmd === 'play' || cmd === 'pause') {
      playback.isPlaying = !playback.isPlaying;
      playback.progressMs = estProgress(); playback.fetchedAt = performance.now();
    }
    schedulePoll(400);
  } catch (e) { setMsg('Playback control failed'); }
}

/* ============================== ALBUM ART ============================== */
const art = { img: null, rgb: null, glow: '#ff5fd0' };
function loadArt(url) {
  if (!url) return;
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    art.img = img;
    try {
      const t = document.createElement('canvas');
      t.width = t.height = 12;
      const tc = t.getContext('2d', { willReadFrequently: true });
      tc.drawImage(img, 0, 0, 12, 12);
      const d = tc.getImageData(0, 0, 12, 12).data;
      let best = null, bestS = -1;
      for (let i = 0; i < d.length; i += 4) {
        const r = d[i], g = d[i + 1], b = d[i + 2];
        const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
        const sat = mx - mn, lum = (mx + mn) / 2;
        const score = sat * (1 - Math.abs(lum - 150) / 200);
        if (score > bestS) { bestS = score; best = [r, g, b]; }
      }
      if (best) { art.rgb = best; art.glow = `rgb(${best[0]},${best[1]},${best[2]})`; }
    } catch (e) { art.rgb = null; art.glow = '#ff5fd0'; }
  };
  img.onerror = () => { art.img = null; art.rgb = null; art.glow = '#ff5fd0'; };
  img.src = url;
}

/* ============================== AUDIO ============================== */
const audio = {
  mode: 'none', ctx: null, analyser: null, freq: null, stream: null, err: '',
  bands: { bass: 0, mid: 0, high: 0 },
  slowBass: 0.0001, wasAbove: false, transient: false,
  deviceId: ls.get('rw.device') || '', devices: [],
};
async function enableAudio(deviceId) {
  try {
    if (audio.stream) { audio.stream.getTracks().forEach(t => t.stop()); audio.stream = null; }
    const cs = { echoCancellation: false, noiseSuppression: false, autoGainControl: false };
    if (deviceId) cs.deviceId = { exact: deviceId };
    const stream = await navigator.mediaDevices.getUserMedia({ audio: cs });
    audio.stream = stream; audio.err = '';
    if (!audio.ctx) audio.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.ctx.state === 'suspended') await audio.ctx.resume();
    const src = audio.ctx.createMediaStreamSource(stream);
    audio.analyser = audio.ctx.createAnalyser();
    audio.analyser.fftSize = 2048;
    audio.analyser.smoothingTimeConstant = 0.35;
    src.connect(audio.analyser);
    audio.freq = new Uint8Array(audio.analyser.frequencyBinCount);
    audio.mode = 'mic';
    if (deviceId) { audio.deviceId = deviceId; ls.set('rw.device', deviceId); }
    setMsg('Audio input live');
    listDevices();
  } catch (e) {
    audio.mode = 'none'; audio.err = e.name || 'error';
    setMsg('Audio blocked — using timeline fallback');
  }
}
async function listDevices() {
  try {
    const all = await navigator.mediaDevices.enumerateDevices();
    audio.devices = all.filter(d => d.kind === 'audioinput');
  } catch (e) {}
}
function sampleAudio(dtS, t) {
  const b = audio.bands;
  const k = 1 - Math.exp(-dtS / CONFIG.BAND_SMOOTH_S);
  audio.transient = false;
  if (audio.mode === 'mic' && audio.analyser) {
    audio.analyser.getByteFrequencyData(audio.freq);
    const n = audio.freq.length, sr = (audio.ctx && audio.ctx.sampleRate) || 48000;
    const bin = f => clamp(Math.round(f / (sr / 2) * n), 0, n - 1);
    const avg = (f0, f1) => {
      const a = bin(f0), z = bin(f1); let s = 0;
      for (let i = a; i <= z; i++) s += audio.freq[i];
      return (s / Math.max(1, z - a + 1)) / 255;
    };
    const rb = avg(30, 140), rm = avg(200, 1800), rh = avg(2500, 9000);
    b.bass += (clamp01(rb * 1.5) - b.bass) * k;
    b.mid += (clamp01(rm * 1.7) - b.mid) * k;
    b.high += (clamp01(rh * 2.1) - b.high) * k;
    audio.slowBass = lerp(audio.slowBass, b.bass, 1 - Math.exp(-dtS / 0.9));
    const above = b.bass > audio.slowBass * 1.35 + 0.04;
    if (above && !audio.wasAbove) audio.transient = true;
    audio.wasAbove = above;
  } else {
    // timeline fallback: a steady 116bpm pulse so the scene still breathes
    const beat = t * 116 / 60, ph = beat % 1;
    const env = Math.pow(1 - ph, 2.4);
    const on = playback.isPlaying || demo.on ? 1 : 0.25;
    b.bass += ((0.22 + 0.68 * env) * on - b.bass) * k;
    b.mid += ((0.30 + 0.34 * Math.abs(Math.sin(t * 1.7))) * on - b.mid) * k;
    b.high += ((0.26 + 0.40 * Math.abs(Math.sin(t * 3.1 + 1.1))) * on - b.high) * k;
    if (ph < dtS * 116 / 60) audio.transient = true;
  }
}

/* ============================== DEMO ============================== */
const DEMO_TRACKS = [
  ['NEON ARCADE', 'PIXEL DRIFT'], ['MIDNIGHT LOOP', 'CASSETTE CLUB'],
  ['SUNSET BOULEVARD', 'TAPE HISS'], ['GHOST IN THE MIX', 'DUB SIGNAL'],
  ['LATE TRANSFER', 'ROOM TONE'], ['CHROME HEARTS', 'VHS ROMANCE'],
];
const demo = { on: /[?&]demo\b/i.test(location.search), i: -1, next: 0 };
function demoTick(now) {
  if (!demo.on || hasTok() || now < demo.next) return;
  demo.i = (demo.i + 1) % DEMO_TRACKS.length;
  const t = DEMO_TRACKS[demo.i], dur = 165000 + Math.floor(Math.random() * 90000);
  onPlayback({ is_playing: true, progress_ms: 0,
    item: { id: 'demo-' + demo.i, name: t[0], artists: [{ name: t[1] }], duration_ms: dur, album: { images: [] } } });
  demo.next = now + Math.min(dur, 42000);
}

/* ============================== SCENE STATE ============================== */


/* ============================== WAKE LOCK ============================== */
// tablets dim and lock on a timer regardless of what is on screen. hold a screen
// wake lock while the page is visible, and re-acquire it after tab switches
// (the lock is dropped automatically when the page is hidden).
let _wake = null;
async function acquireWake() {
  try {
    if (!('wakeLock' in navigator)) return;
    if (_wake && !_wake.released) return;
    _wake = await navigator.wakeLock.request('screen');
    _wake.addEventListener('release', () => { _wake = null; });
  } catch (e) { /* denied, or not a user gesture yet -- retried on next interaction */ }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') acquireWake();
});
for (const ev of ['pointerdown', 'keydown', 'touchstart']) {
  addEventListener(ev, acquireWake, { passive: true });
}
addEventListener('load', acquireWake);

/* ============================== 3D SCENE ============================== */
const app = document.getElementById('app');
let renderer, scene, camera, clock;
const M = {};                             // material/mesh handles we animate

function tex2d(w, h, draw) {              // helper: canvas -> THREE texture
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = 4;
  return { tex: t, cv: c };
}

// neon artwork drawn to a canvas, used as an emissive map on a plane
function neonCanvas(w, h, draw) {
  return tex2d(w, h, (c) => {
    c.clearRect(0, 0, w, h);
    c.lineCap = 'round'; c.lineJoin = 'round';
    draw(c);
  });
}

function neonPlane(w, h, texObj, colour) {
  const g = new THREE.Group();
  const mat = new THREE.MeshBasicMaterial({
    map: texObj.tex, transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending, color: new THREE.Color(colour),
  });
  const core = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  g.add(core);
  // fake bloom: a larger, softer copy behind the sharp one
  const halo = new THREE.Mesh(new THREE.PlaneGeometry(w * 1.35, h * 1.35), mat.clone());
  halo.material.opacity = 0.55;
  halo.position.z = -0.012;
  g.add(halo);
  g.userData.mats = [core.material, halo.material];
  return g;
}

function palmArt(col) {
  return neonCanvas(256, 256, c => {
    c.strokeStyle = col; c.lineWidth = 9;
    c.beginPath(); c.moveTo(120, 250); c.quadraticCurveTo(132, 150, 150, 70); c.stroke();
    for (let i = 0; i < 7; i++) {
      const a = -Math.PI * 0.98 + i * 0.36;
      c.beginPath(); c.moveTo(150, 70);
      c.quadraticCurveTo(150 + Math.cos(a) * 60, 70 + Math.sin(a) * 70,
                         150 + Math.cos(a) * 108, 70 + Math.sin(a) * 46);
      c.stroke();
    }
  });
}
function flamingoArt() {
  return neonCanvas(256, 256, c => {
    c.strokeStyle = '#ff6fb0'; c.lineWidth = 9;
    c.beginPath();
    c.moveTo(120, 250); c.lineTo(126, 150);
    c.moveTo(84, 150);
    c.bezierCurveTo(60, 76, 186, 60, 166, 142);
    c.bezierCurveTo(154, 152, 106, 156, 84, 150);
    c.moveTo(160, 92);
    c.bezierCurveTo(172, 36, 128, 20, 116, 52);
    c.lineTo(92, 60);
    c.stroke();
  });
}
function signArt() {
  return neonCanvas(512, 256, c => {
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillStyle = '#ff2f9f';
    c.font = '800 108px ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif';
    c.fillText('MIAMI', 256, 78);
    c.strokeStyle = '#7df9ff'; c.lineWidth = 7;
    c.strokeRect(176, 138, 160, 76);
    c.fillStyle = '#7df9ff';
    c.font = '800 58px ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif';
    c.fillText('85', 256, 178);
  });
}

// sunset seen through the window
function sunsetArt() {
  return tex2d(512, 512, (c, w, h) => {
    const g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#3b1466'); g.addColorStop(0.40, '#8e2a86');
    g.addColorStop(0.68, '#ff5f8a'); g.addColorStop(0.88, '#ffb267'); g.addColorStop(1, '#ffd9a0');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    c.fillStyle = '#ffe7ad';
    c.beginPath(); c.arc(w * 0.54, h * 0.70, 78, 0, 6.2832); c.fill();
    c.fillStyle = 'rgba(40,10,60,.5)'; c.fillRect(0, h * 0.80, w, h * 0.20);
    c.strokeStyle = '#2a0c3e'; c.lineWidth = 7;                       // palm silhouettes
    for (const px of [w * 0.12, w * 0.80, w * 0.92]) {
      c.beginPath(); c.moveTo(px, h * 0.82); c.lineTo(px + 6, h * 0.52); c.stroke();
      for (let i = 0; i < 5; i++) {
        const a = -Math.PI * 0.9 + i * 0.45;
        c.beginPath(); c.moveTo(px + 6, h * 0.52);
        c.quadraticCurveTo(px + 6 + Math.cos(a) * 26, h * 0.52 + Math.sin(a) * 30,
                           px + 6 + Math.cos(a) * 48, h * 0.52 + Math.sin(a) * 18);
        c.stroke();
      }
    }
  });
}

/* ---- bloom: bright-pass -> separable blur -> additive composite ---- */
const VS_QUAD = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';
const FS_BRIGHT = `
  uniform sampler2D tDiffuse; uniform float threshold; varying vec2 vUv;
  void main(){
    vec4 c = texture2D(tDiffuse, vUv);
    float l = dot(c.rgb, vec3(0.2126, 0.7152, 0.0722));
    float f = smoothstep(threshold, threshold + 0.30, l);
    gl_FragColor = vec4(c.rgb * f, 1.0);
  }`;
const FS_BLUR = `
  uniform sampler2D tDiffuse; uniform vec2 dir; uniform vec2 res; varying vec2 vUv;
  void main(){
    vec2 px = dir / res;
    vec4 s = texture2D(tDiffuse, vUv) * 0.2270270270;
    s += (texture2D(tDiffuse, vUv + px * 1.3846153846) + texture2D(tDiffuse, vUv - px * 1.3846153846)) * 0.3162162162;
    s += (texture2D(tDiffuse, vUv + px * 3.2307692308) + texture2D(tDiffuse, vUv - px * 3.2307692308)) * 0.0702702703;
    gl_FragColor = s;
  }`;
const FS_COMP = `
  uniform sampler2D tBase; uniform sampler2D tBloom; uniform float strength; varying vec2 vUv;
  void main(){
    vec3 base = texture2D(tBase, vUv).rgb;
    vec3 glow = texture2D(tBloom, vUv).rgb;
    vec3 col = base + glow * strength;
    vec2 d = vUv - 0.5;
    col *= mix(0.48, 1.0, smoothstep(0.86, 0.22, length(d)));   // vignette
    col = pow(max(col, 0.0), vec3(0.90));                        // lift the mids
    gl_FragColor = vec4(col, 1.0);
  }`;
const FX = {};
function buildBloom(w, h) {
  const opt = { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat };
  const hw = Math.max(1, Math.floor(w / 2)), hh = Math.max(1, Math.floor(h / 2));
  FX.base = new THREE.WebGLRenderTarget(w, h, opt);
  FX.a = new THREE.WebGLRenderTarget(hw, hh, opt);
  FX.b = new THREE.WebGLRenderTarget(hw, hh, opt);
  FX.scene = new THREE.Scene();
  FX.cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  FX.quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.MeshBasicMaterial());
  FX.scene.add(FX.quad);
  FX.bright = new THREE.ShaderMaterial({ uniforms: { tDiffuse: { value: null }, threshold: { value: 0.55 } },
    vertexShader: VS_QUAD, fragmentShader: FS_BRIGHT });
  FX.blur = new THREE.ShaderMaterial({ uniforms: { tDiffuse: { value: null },
    dir: { value: new THREE.Vector2(1, 0) }, res: { value: new THREE.Vector2(hw, hh) } },
    vertexShader: VS_QUAD, fragmentShader: FS_BLUR });
  FX.comp = new THREE.ShaderMaterial({ uniforms: { tBase: { value: null }, tBloom: { value: null },
    strength: { value: 1.15 } }, vertexShader: VS_QUAD, fragmentShader: FS_COMP });
}
function resizeBloom(w, h) {
  if (!FX.base) return;
  const hw = Math.max(1, Math.floor(w / 2)), hh = Math.max(1, Math.floor(h / 2));
  FX.base.setSize(w, h); FX.a.setSize(hw, hh); FX.b.setSize(hw, hh);
  FX.blur.uniforms.res.value.set(hw, hh);
}
function renderWithBloom() {
  const pass = (mat, target) => { FX.quad.material = mat; renderer.setRenderTarget(target); renderer.render(FX.scene, FX.cam); };
  renderer.setRenderTarget(FX.base); renderer.clear(); renderer.render(scene, camera);
  FX.bright.uniforms.tDiffuse.value = FX.base.texture;                    pass(FX.bright, FX.a);
  FX.blur.uniforms.tDiffuse.value = FX.a.texture; FX.blur.uniforms.dir.value.set(1, 0); pass(FX.blur, FX.b);
  FX.blur.uniforms.tDiffuse.value = FX.b.texture; FX.blur.uniforms.dir.value.set(0, 1); pass(FX.blur, FX.a);
  FX.comp.uniforms.tBase.value = FX.base.texture;
  FX.comp.uniforms.tBloom.value = FX.a.texture;
  pass(FX.comp, null);
}

/* ---- camera presets ---- */
const CAMS = [
  { p: [2.9, 1.85, 4.3], t: [-0.5, 1.25, -1.4] },
  { p: [-1.2, 1.6, 3.6], t: [-1.6, 1.2, -0.6] },
  { p: [3.2, 2.3, 0.4], t: [-1.0, 1.3, -1.6] },
];
let camIdx = 0;
function cycleCam() {
  camIdx = (camIdx + 1) % CAMS.length;
  const c = CAMS[camIdx];
  camera.position.set(c.p[0], c.p[1], c.p[2]);
  camera.lookAt(c.t[0], c.t[1], c.t[2]);
}

/* ============================== ANIMATE ============================== */
function animate() {
  requestAnimationFrame(animate);
  const dtS = Math.min(0.05, clock.getDelta());
  const t = clock.getElapsedTime();
  const now = performance.now();

  demoTick(now);
  sampleAudio(dtS, t);
  const b = audio.bands.bass, mid = audio.bands.mid, hi = audio.bands.high;

  if (audio.transient) scene2.flash = Math.min(1, scene2.flash + 0.6);
  scene2.flash *= Math.pow(0.02, dtS);

  const moving = playback.isPlaying || demo.on;
  scene2.spin += dtS * (moving ? 3.4 + b * 2.0 : 0.2);
  if (M.platter) M.platter.rotation.y = scene2.spin;
  if (M.label) M.label.rotation.z = scene2.spin;

  // neon breathes with the low end
  const pulse = 0.72 + b * 0.55 + scene2.flash * 0.3;
  for (const g of M.neon || []) for (const m of g.userData.mats) m.opacity = clamp01(pulse * (m === g.userData.mats[1] ? 0.5 : 1));
  if (M.neonPink) M.neonPink.intensity = 1.1 + b * 1.8;
  if (M.neonCyan) M.neonCyan.intensity = 0.8 + mid * 1.2;
  if (M.crtLight) M.crtLight.intensity = 0.7 + hi * 0.9;
  if (M.lampLight) M.lampLight.intensity = 1.3 + b * 0.5;
  if (M.strip) M.strip.material.color.setHSL(0.88, 0.7, 0.55 + b * 0.2);

  // VU meters
  for (let i = 0; i < (M.vu || []).length; i++) {
    const lvl = [b, mid, hi][i];
    M.vu[i].scale.x = clamp(lvl * 1.6, 0.06, 1);
    M.vu[i].material.color.setHSL(clamp(0.33 - lvl * 0.33, 0, 0.33), 0.9, 0.55);
  }

  if (M.label && art.rgb) M.label.material.color.setRGB(art.rgb[0] / 255, art.rgb[1] / 255, art.rgb[2] / 255);

  drawCRT(t);
  updateHud();
  // refresh the floor reflection a few times a second, not every frame
  M.envTick = (M.envTick || 0) + 1;
  if (M.cubeCam && M.envTick % 12 === 0) {
    M.floor.visible = false;
    M.cubeCam.update(renderer, scene);
    M.floor.visible = true;
    renderer.setRenderTarget(null);
  }
  FX.comp.uniforms.strength.value = 1.0 + b * 0.6;
  renderWithBloom();
}

/* ============================== HUD ============================== */
const el = id => document.getElementById(id);
function fmt(ms) { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function updateHud() {
  const now = performance.now();
  const linked = hasTok() || demo.on;
  const line = msg && now < msgUntil ? msg
    : !linked ? 'Click to connect Spotify'
    : playback.trackId ? playback.title : 'Nothing playing';
  el('t1').textContent = line;
  el('t2').textContent = playback.artist || (linked ? '' : 'or add ?demo to the URL');
  document.documentElement.style.setProperty('--glow', art.glow);
  const d = playback.durationMs;
  el('barf').style.width = d > 0 ? (clamp01(clamp(estProgress(), 0, d) / d) * 100) + '%' : '0%';
  el('bPlay').textContent = playback.isPlaying ? '❚❚' : '▶';
}

/* ============================== INPUT ============================== */
el('bPrev').onclick = () => transport('prev');
el('bNext').onclick = () => transport('next');
el('bPlay').onclick = () => transport('toggle');
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'f') { const d = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen(); else d.requestFullscreen && d.requestFullscreen().catch(() => {});
    e.preventDefault(); return; }
  if (k === 'c') { cycleCam(); e.preventDefault(); return; }
  if (k === 'a') { enableAudio(audio.deviceId || ''); e.preventDefault(); return; }
  if (k === ' ') { transport('toggle'); e.preventDefault(); return; }
  if (k === 'arrowright') { transport('next'); e.preventDefault(); return; }
  if (k === 'arrowleft') { transport('prev'); e.preventDefault(); return; }
});
app.addEventListener('click', () => { if (!hasTok() && !demo.on) beginAuth(); });

el('btnCancel').onclick = () => { el('setup').style.display = 'none'; };
el('btnReset').onclick = () => { clearAuth(); ls.del('rw.cid'); setMsg('Auth reset'); el('setup').style.display = 'none'; };
el('btnSave').onclick = () => {
  const v = el('inClient').value.trim();
  if (v) ls.set('rw.cid', v);
  el('setup').style.display = 'none';
  beginAuth();
};

/* ============================== BOOT ============================== */
(async function boot() {
  if (typeof THREE === 'undefined') {
    el('boot').textContent = 'Could not load three.js — check your connection.';
    return;
  }
  try { buildScene(); }
  catch (e) { el('boot').textContent = 'Scene error: ' + (e && e.message); return; }
  await handleRedirect();
  schedulePoll(0);
  animate();
})();
</script>
