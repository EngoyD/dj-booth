<!doctype html>
<!--
  dj-booth.html — Game Boy overworld-style pixel lounge with a DJ mixing your Spotify playback.
  True 160x144 screen, 4-shade blue-gray ramp, top-down tile view, 16x16 overworld sprites.
  Original sprites and tiles throughout (style homage; no Nintendo assets). Single file, no build.

  Run:   python3 -m http.server 5173 --bind 127.0.0.1   (from this file's directory)
  Open:  http://127.0.0.1:5173/dj-booth.html            (http on 127.0.0.1 required:
         crypto.subtle + getUserMedia need a secure context; file:// will not work)
  Auth:  Spotify dashboard -> create app (Web API) -> add the exact redirect URI above
         -> paste the Client ID into the Connect prompt (or CONFIG.SPOTIFY_CLIENT_ID).
  Audio: click a wall speaker (or press A) and pick BlackHole 2ch from the in-game menu.
  Connect: click the screen when the DJ has the "!" bubble; song + artist then live in the dialog box.
  Keys:  S force swap · R force scratch · D debug · A audio menu · F fullscreen · arrows/enter in menus
-->

<title>DJ Booth</title>
<style>

    font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#dde2ea;background:#181410}

<body>
<div id="stage"><canvas id="cv"></canvas></div>

<div id="setup"><div class="panel">
  <h3>SPOTIFY SETUP</h3>
  <div class="note">Create an app at developer.spotify.com/dashboard (Web API), then add this exact Redirect URI to it:</div>
  <code id="ruri"></code>
  <input id="inClient" placeholder="Spotify Client ID" spellcheck="false" autocomplete="off">
  <div style="display:flex;gap:8px;justify-content:flex-end">

    <button id="btnCancel">Cancel</button>
    <button id="btnSave">Save &amp; connect</button>
  </div>
</div></div>

<script>
/* ============================== CONFIG ============================== */
const CONFIG = {
  SPOTIFY_CLIENT_ID: '21e1242fd5504931af52031eeed0fbff',   // shared default; safe to publish (PKCE, no secret)
  REDIRECT_URI: location.origin + location.pathname,

  POLL_MS_PLAYING: 3000,
  POLL_MS_IDLE: 10000,

  PLATTER_RPM: 100 / 3,                  // 33 1/3
  SWAP_MS: 2600,                        // longer: the DJ now walks to the deck and back
  SCRATCH_MS: 600,
  SCRATCH_RANDOM_MIN_S: 20,
  SCRATCH_RANDOM_MAX_S: 60,
  SCRATCH_MIN_GAP_MS: 4000,

  BAND_SMOOTH_S: 0.12,
  TRANSIENT_SENSITIVITY: 1.55,
  TRANSIENT_FLOOR: 0.16,
  TRANSIENT_REFRACTORY_MS: 320,
  FALLBACK_BPM: 116,

  BOB_HZ: 2.1,
  SWAY_MAX_PX: 1,

  ART_FADE_MS: 800,                      // wall-art crossfade (ordered Bayer dither)
  ANIM_FPS: 8,                           // overworld sprites animate at this steppy clock
  ROTATION_STEPS: 12,                    // platter marker/strobe rotation frames

  MONO_STRICT: true,                     // scene locked to the 4-shade ramp
  ART_MONO: false,                       // true = crush album art to the ramp too
  ACCENT_OVERRIDE: null,                 // e.g. '#f8d038' (used verbatim)
  ACCENT_SNAP: true,                     // snap sampled accent to the GB accent set

  GB_GRID: true,                         // faint LCD pixel grid overlay
  GB_GRID_ALPHA: 0.07,

  PARTICLE_MAX: 30,                      // pixel music notes
  PARTICLE_RATE: 14,
  DEBUG_START: false,
};
const PW = 160, PH = 144;                // true Game Boy screen

/* ============================== PALETTE ============================== */
// 4-shade warm sepia ramp matching the lounge reference; the whole scene uses only these.
const GB0 = '#f8f0d8', GB1 = '#c8b078', GB2 = '#786048', GB3 = '#181410';
const RAMP4 = [[248, 240, 216], [200, 176, 120], [120, 96, 72], [24, 20, 16]];
// Super Game Boy style: the room is drawn once on the 4-shade ramp, then each
// region is remapped to its own 4 colours. Sprites keep the warm base ramp.
const PAL = {
  wall:  [[232, 232, 248], [160, 168, 216], [ 88, 104, 160], [ 24,  24,  40]],
  booth: [[240, 224, 248], [176, 144, 192], [112,  80, 128], [ 32,  24,  40]],
  cafe:  [[248, 224, 208], [208, 152, 120], [144,  72,  56], [ 40,  16,   8]],
  couch: [[224, 240, 216], [160, 200, 136], [ 80, 120,  72], [ 24,  32,   8]],
};
function rampIndex(r, g, b) {
  for (let i = 0; i < 4; i++) {
    const c = RAMP4[i];
    if (c[0] === r && c[1] === g && c[2] === b) return i;
  }
  return -1;
}
function tintRegion(c, x, y, w, h, ramp) {
  x = Math.max(0, x); y = Math.max(0, y);
  w = Math.min(w, PW - x); h = Math.min(h, PH - y);
  if (w <= 0 || h <= 0) return;
  try {
    const id = c.getImageData(x, y, w, h), d = id.data;
    for (let i = 0; i < d.length; i += 4) {
      const k = rampIndex(d[i], d[i + 1], d[i + 2]);
      if (k >= 0) { d[i] = ramp[k][0]; d[i + 1] = ramp[k][1]; d[i + 2] = ramp[k][2]; }
    }
    c.putImageData(id, x, y);
  } catch (e) {}
}
// Richer GB-flavored palette used only to quantize album art (SGB-style colorized surface).
const ART_COLS = [
  [248, 248, 240], [240, 224, 176], [216, 176, 112], [160, 104, 56], [104, 64, 32],
  [224, 72, 56], [144, 32, 32], [248, 208, 56], [200, 144, 16], [104, 176, 72],
  [48, 104, 48], [104, 136, 208], [48, 80, 160], [40, 40, 56], [168, 168, 176],
  [88, 88, 104], [248, 192, 136], [16, 24, 32], [152, 104, 200], [72, 168, 160],
  [232, 236, 232], [192, 192, 184], [128, 96, 160], [88, 48, 120], [232, 168, 64],
  [168, 72, 24], [56, 144, 104], [24, 64, 88], [176, 208, 232], [232, 224, 120],
  [136, 168, 88], [64, 44, 24], [216, 120, 104], [120, 24, 64], [32, 32, 24],
  [200, 232, 200],
];
const ACCENTS = [
  [248, 208, 56], [224, 72, 56], [104, 136, 208], [104, 176, 72],
  [152, 104, 200], [232, 128, 40], [72, 168, 160], [232, 136, 176],
];

/* ============================== UTILS ============================== */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const clamp01 = v => clamp(v, 0, 1);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const rand = (a, b) => a + Math.random() * (b - a);
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
function coverDraw(c, img, w, h) {
  const s = Math.max(w / img.width, h / img.height);
  const dw = img.width * s, dh = img.height * s;
  c.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
}
function shrinkStepped(img, size) {      // halve repeatedly; one-shot 640->38 loses detail
  let w = Math.min(512, img.width), h = Math.min(512, img.height);
  let cur = mk(w, h);
  coverDraw(cur.getContext('2d'), img, w, h);
  while (w >= size * 4) {
    w = w >> 1; h = h >> 1;
    const nx = mk(w, h);
    nx.getContext('2d').drawImage(cur, 0, 0, w, h);
    cur = nx;
  }
  const out = mk(size, size);
  out.getContext('2d').drawImage(cur, 0, 0, size, size);
  return out;
}
function autoLevel(id) {                 // 2%-98% per-channel stretch: thumbnails read flat otherwise
  const d = id.data, n = d.length / 4;
  for (let ch = 0; ch < 3; ch++) {
    const hist = new Array(256).fill(0);
    for (let i = 0; i < d.length; i += 4) hist[d[i + ch]]++;
    let lo = 0, hi = 255, acc = 0;
    for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= n * 0.02) { lo = v; break; } }
    acc = 0;
    for (let v = 255; v >= 0; v--) { acc += hist[v]; if (acc >= n * 0.02) { hi = v; break; } }
    const range = Math.max(24, hi - lo);
    for (let i = 0; i < d.length; i += 4) {
      d[i + ch] = Math.max(0, Math.min(255, Math.round((d[i + ch] - lo) * 255 / range)));
    }
  }
}
function sharpen(id, w, h, amt) {        // light unsharp: edges survive the pixel scale
  const d = id.data, src2 = new Uint8ClampedArray(d);
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      for (let ch = 0; ch < 3; ch++) {
        const i = (y * w + x) * 4 + ch;
        const v = 5 * src2[i] - src2[i - 4] - src2[i + 4] - src2[i - w * 4] - src2[i + w * 4];
        d[i] = Math.max(0, Math.min(255, Math.round(src2[i] * (1 - amt) + v * amt)));
      }
    }
  }
}
function medianCut(id, want) {           // adaptive per-cover palette, snapped to 8-level channels
  let boxes = [Array.from({ length: id.data.length / 4 }, (_, k) => k * 4)];
  const d = id.data;
  while (boxes.length < want) {
    let bi = -1, bs = -1;
    for (let i = 0; i < boxes.length; i++) {
      const b = boxes[i];
      if (b.length < 2) continue;
      let mn = [255, 255, 255], mx = [0, 0, 0];
      for (const p of b) for (let c = 0; c < 3; c++) { const v = d[p + c]; if (v < mn[c]) mn[c] = v; if (v > mx[c]) mx[c] = v; }
      const spread = Math.max(mx[0] - mn[0], mx[1] - mn[1], mx[2] - mn[2]);
      if (spread > bs) { bs = spread; bi = i; }
    }
    if (bi < 0 || bs < 8) break;
    const b = boxes[bi];
    let ch = 0, mn = [255, 255, 255], mx = [0, 0, 0];
    for (const p of b) for (let c = 0; c < 3; c++) { const v = d[p + c]; if (v < mn[c]) mn[c] = v; if (v > mx[c]) mx[c] = v; }
    for (let c = 1; c < 3; c++) if (mx[c] - mn[c] > mx[ch] - mn[ch]) ch = c;
    b.sort((p, q) => d[p + ch] - d[q + ch]);
    const half = b.length >> 1;
    boxes.splice(bi, 1, b.slice(0, half), b.slice(half));
  }
  const pal = boxes.filter(b => b.length).map(b => {
    let r = 0, g = 0, bl = 0;
    for (const p of b) { r += d[p]; g += d[p + 1]; bl += d[p + 2]; }
    const n = b.length;
    const snap = v => Math.max(0, Math.min(255, Math.round(v / n / 8) * 8));
    return [snap(r), snap(g), snap(bl)];
  });
  return pal.length >= 4 ? pal : null;
}
function parseHex(x) {
  const m = /^#?([0-9a-f]{6})$/i.exec(x || '');
  if (!m) return null;
  const n = parseInt(m[1], 16);
  return [n >> 16 & 255, n >> 8 & 255, n & 255];
}
const ls = {
  get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
  del: k => { try { localStorage.removeItem(k); } catch (e) {} },
};

/* ============================== ACCENT + ART QUANTIZER ============================== */
function nearest(list, r, g, b) {
  let best = list[0], bd = Infinity;
  for (let i = 0; i < list.length; i++) {
    const c = list[i];
    const d = (c[0] - r) * (c[0] - r) + (c[1] - g) * (c[1] - g) + (c[2] - b) * (c[2] - b);
    if (d < bd) { bd = d; best = c; }
  }
  return best;
}
function quantizeCanvas(c, pal, dither, spread) {
  try {
    const x = c.getContext('2d');
    const w = c.width;
    const id = x.getImageData(0, 0, w, c.height);
    const d = id.data;
    let pr = -1, pg = -1, pb = -1, qr = 0, qg = 0, qb = 0;
    for (let i = 0; i < d.length; i += 4) {
      let r = d[i], g = d[i + 1], b = d[i + 2];
      if (dither) {                        // ordered Bayer dither: fake gradients at 36px
        const px2 = (i >> 2) % w, py2 = ((i >> 2) / w) | 0;
        const o = (BAYER4[py2 & 3][px2 & 3] / 16 - 0.47) * (spread || 30);
        r = Math.max(0, Math.min(255, r + o));
        g = Math.max(0, Math.min(255, g + o));
        b = Math.max(0, Math.min(255, b + o));
        const q = nearest(pal, r, g, b);
        d[i] = q[0]; d[i + 1] = q[1]; d[i + 2] = q[2]; d[i + 3] = 255;
        continue;
      }
      if (r !== pr || g !== pg || b !== pb) {
        const q = nearest(pal, r, g, b);
        qr = q[0]; qg = q[1]; qb = q[2];
        pr = r; pg = g; pb = b;
      }
      d[i] = qr; d[i + 1] = qg; d[i + 2] = qb; d[i + 3] = 255;
    }
    x.putImageData(id, 0, 0);
  } catch (e) {}
}
const accent = { cur: ACCENTS[0].slice(), tgt: ACCENTS[0].slice() };
function setAccent(rgbArr) {
  const o = parseHex(CONFIG.ACCENT_OVERRIDE);
  if (o) { accent.tgt = o.slice(); return; }
  const c = rgbArr || ACCENTS[0];
  accent.tgt = (CONFIG.ACCENT_SNAP ? nearest(ACCENTS, c[0], c[1], c[2]) : c).slice();
}
function aHex() {
  const c = accent.cur;
  return 'rgb(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ')';
}
function sampleAccent(img) {
  try {
    const n = 24, c = mk(n, n), x = c.getContext('2d', { willReadFrequently: true });
    coverDraw(x, img, n, n);
    const d = x.getImageData(0, 0, n, n).data;
    let best = null, bs = -1;
    for (let i = 0; i < d.length; i += 4) {
      const r = d[i], g = d[i + 1], b = d[i + 2];
      const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
      const sat = mx ? (mx - mn) / mx : 0;
      const lum = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
      const sc = sat * sat * (1 - Math.abs(lum - 0.55));
      if (sc > bs) { bs = sc; best = [r, g, b]; }
    }
    return (!best || bs < 0.02) ? ACCENTS[0] : best;
  } catch (e) { return ACCENTS[0]; }
}

/* ============================== DOM / CANVAS ============================== */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const px = mk(PW, PH), p = px.getContext('2d');
p.imageSmoothingEnabled = false;
const setup = document.getElementById('setup'), ruri = document.getElementById('ruri');
const inClient = document.getElementById('inClient');
const btnSave = document.getElementById('btnSave'), btnCancel = document.getElementById('btnCancel'), btnReset = document.getElementById('btnReset');

let intScale = 1, dprFac = 1, gridCv = null;
function buildGrid() {
  gridCv = null;
  if (!CONFIG.GB_GRID || intScale < 4) return;
  gridCv = mk(cv.width, cv.height);
  const c = gridCv.getContext('2d');
  c.fillStyle = 'rgba(20,20,30,' + CONFIG.GB_GRID_ALPHA + ')';
  for (let x = 1; x <= PW; x++) c.fillRect(x * intScale - 1, 0, 1, cv.height);
  for (let y = 1; y <= PH; y++) c.fillRect(0, y * intScale - 1, cv.width, 1);
}
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const s = Math.max(1, Math.floor(Math.min(innerWidth * dpr / PW, innerHeight * dpr / PH)));
  cv.width = PW * s;
  cv.height = PH * s;
  cv.style.width = (cv.width / dpr) + 'px';
  cv.style.height = (cv.height / dpr) + 'px';
  intScale = s;
  dprFac = dpr;
  buildGrid();
}
addEventListener('resize', resize);
resize();

/* ============================== TOUCH FULLSCREEN ============================== */
// tablets have no F key, so expose a real control. it fades out when idle and
// comes back on any touch, so it does not sit on top of the visual.
(function () {
  const btn = document.createElement('div');
  btn.id = 'fsbtn';
  btn.textContent = '\u26F6';
  btn.setAttribute('role', 'button');
  btn.setAttribute('aria-label', 'Toggle fullscreen');
  document.body.appendChild(btn);
  let idle;
  function poke() {
    btn.classList.remove('dim');
    clearTimeout(idle);
    idle = setTimeout(() => btn.classList.add('dim'), 3000);
  }
  function goFull() {
    const d = document.documentElement;
    const inFs = document.fullscreenElement || document.webkitFullscreenElement;
    try {
      if (inFs) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        const req = d.requestFullscreen || d.webkitRequestFullscreen || d.webkitRequestFullScreen;
        if (req) Promise.resolve(req.call(d)).catch(() => {});
      }
    } catch (e) {}
    if (typeof acquireWake === 'function') acquireWake();
    poke();
  }
  btn.addEventListener('click', e => { e.stopPropagation(); goFull(); });
  btn.addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); goFull(); }, { passive: false });
  for (const ev of ['pointerdown', 'touchstart', 'mousemove']) {
    addEventListener(ev, poke, { passive: true });
  }
  poke();
})();

/* ============================== WAKE LOCK ============================== */
// tablets dim and lock on a timer regardless of what is on screen. hold a screen
// wake lock while the page is visible, and re-acquire it after tab switches
// (the lock is dropped automatically when the page is hidden).
let _wake = null;
async function acquireWake() {
  try {
    if (!('wakeLock' in navigator)) return;
    if (_wake && !_wake.released) return;
    _wake = await navigator.wakeLock.request('screen');
    _wake.addEventListener('release', () => { _wake = null; });
  } catch (e) { /* denied, or not a user gesture yet -- retried on next interaction */ }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') acquireWake();
});
for (const ev of ['pointerdown', 'keydown', 'touchstart']) {
  addEventListener(ev, acquireWake, { passive: true });
}
addEventListener('load', acquireWake);

/* ============================== FULLSCREEN ============================== */
function fsElement() { return document.fullscreenElement || document.webkitFullscreenElement || null; }
function toggleFullscreen() {
  const el = document.documentElement;
  try {
    if (fsElement()) {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) Promise.resolve(exit.call(document)).catch(() => {});
    } else {
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (!req) { setMsg('Fullscreen not supported here.'); return; }
      Promise.resolve(req.call(el)).catch(e => setMsg('Fullscreen blocked: ' + (e.message || e)));
    }
  } catch (e) { setMsg('Fullscreen failed: ' + (e.message || e)); }
}
// innerWidth/innerHeight can lag the change event; re-run on the next frame too
const onFsChange = () => { resize(); requestAnimationFrame(resize); };
document.addEventListener('fullscreenchange', onFsChange);
document.addEventListener('webkitfullscreenchange', onFsChange);

/* ============================== SPOTIFY AUTH (PKCE) ============================== */
function getClientId() { return (ls.get('djb.cid') || CONFIG.SPOTIFY_CLIENT_ID || '').trim(); }
function clearAuth() { ls.del('djb.at'); ls.del('djb.rt'); ls.del('djb.exp'); updateBar(); }
function cleanUrl() { try { history.replaceState({}, '', location.pathname); } catch (e) {} }
function b64url(buf) {
  let s = ''; const u = new Uint8Array(buf);
  for (let i = 0; i < u.length; i++) s += String.fromCharCode(u[i]);
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
async function beginAuth() {
  const cid = getClientId();
  if (!cid) { showSetup(); return; }
  try {
    const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
    const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
    const state = b64url(crypto.getRandomValues(new Uint8Array(12)));
    ls.set('djb.verifier', verifier); ls.set('djb.state', state);
    const q = new URLSearchParams({
      response_type: 'code', client_id: cid,
      scope: 'user-read-currently-playing user-read-playback-state user-modify-playback-state',

async function handleRedirect() {
  const q = new URLSearchParams(location.search);
  if (q.get('error')) { setMsg('Spotify auth error: ' + q.get('error')); cleanUrl(); return; }
  const code = q.get('code');
  if (!code) return;
  const okState = q.get('state') === ls.get('djb.state');
  const verifier = ls.get('djb.verifier');
  ls.del('djb.verifier'); ls.del('djb.state'); cleanUrl();
  if (!okState || !verifier) { setMsg('Auth state mismatch — try connecting again.'); return; }

    if (!r.ok) throw new Error(j.error_description || j.error || ('HTTP ' + r.status));

      const r = await fetch('https://accounts.spotify.com/api/token', {
        method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body,
      });

async function getAccessToken() {

/* ============================== PLAYBACK POLLING ============================== */
const EP = 'https://api.spotify.com/v1/me/player/currently-playing';
const playback = {
  trackId: null, title: '', artist: '', isPlaying: false,
  progressMs: 0, durationMs: 0, fetchedAt: 0, artUrl: null, itemType: '-',
};
const poll = { timer: null, nextAt: 0, inFlight: false, errStreak: 0, last: { status: '-', at: 0, text: 'no poll yet' } };

function schedulePoll(ms) {
  clearTimeout(poll.timer);
  poll.nextAt = Date.now() + ms;
  poll.timer = setTimeout(pollNow, ms);
}
function estProgress() {
  return playback.progressMs + (playback.isPlaying ? (performance.now() - playback.fetchedAt) : 0);
}
function summarize(j) {
  if (!j) return '(204 nothing playing)';
  if (!j.item) return '(no track item: ' + (j.currently_playing_type || '?') + ')';
  const a = (j.item.artists || []).map(x => x.name).join(', ');
  return (j.is_playing ? 'PLAY ' : 'PAUSE ') + j.item.name + ' - ' + a;
}
async function pollNow() {
  if (poll.inFlight) return;
  poll.inFlight = true;
  try {
    const at = await getAccessToken();
    if (!at) {
      poll.last = { status: 'no-token', at: Date.now(), text: 'not connected' };
      updateBar();
      return schedulePoll(CONFIG.POLL_MS_IDLE);
    }
    let r = await fetch(EP, { headers: { Authorization: 'Bearer ' + at } });
    if (r.status === 401 && await refreshToken()) {
      r = await fetch(EP, { headers: { Authorization: 'Bearer ' + ls.get('djb.at') } });
    }
    if (r.status === 401) {
      clearAuth();
      setMsg('Spotify token invalid — reconnect.');
      poll.last = { status: 401, at: Date.now(), text: 'auth failed after refresh' };
      return schedulePoll(CONFIG.POLL_MS_IDLE);
    }
    if (r.status === 429) {
      const ra = parseInt(r.headers.get('Retry-After') || '15', 10) || 15;
      poll.last = { status: 429, at: Date.now(), text: 'rate limited — retry in ' + ra + 's' };
      return schedulePoll(clamp(ra, 1, 300) * 1000);
    }
    if (r.status === 204) {
      onPlayback(null);
      poll.errStreak = 0;
      poll.last = { status: 204, at: Date.now(), text: 'nothing playing' };
      return schedulePoll(CONFIG.POLL_MS_IDLE);
    }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    poll.errStreak = 0;
    onPlayback(j);
    poll.last = { status: 200, at: Date.now(), text: summarize(j) };
    schedulePoll(j.is_playing ? CONFIG.POLL_MS_PLAYING : CONFIG.POLL_MS_IDLE);
  } catch (e) {
    poll.errStreak = Math.min(poll.errStreak + 1, 4);
    poll.last = { status: 'err', at: Date.now(), text: String(e.message || e) };
    schedulePoll(Math.min(3000 * Math.pow(2, poll.errStreak), 60000));
  } finally {
    poll.inFlight = false;
  }
}
function pickArt(imgs) { return (imgs && imgs.length) ? imgs[0].url : null; }
function onPlayback(j) {
  updateBar();
  if (!j || !j.item) {
    if (j) { playback.isPlaying = !!j.is_playing; playback.itemType = j.currently_playing_type || '-'; }
    else { playback.isPlaying = false; }
    playback.fetchedAt = performance.now();
    return;
  }
  const id = j.item.id || j.item.uri;
  const changed = id !== playback.trackId;
  const restart = !changed && (j.progress_ms || 0) < estProgress() - 5000;
  playback.trackId = id;
  playback.itemType = 'track';
  playback.title = j.item.name || '';
  playback.artist = (j.item.artists || []).map(a => a.name).join(', ');
  playback.isPlaying = !!j.is_playing;
  playback.progressMs = j.progress_ms || 0;
  playback.durationMs = j.item.duration_ms || 0;
  playback.fetchedAt = performance.now();
  const url = pickArt(j.item.album && j.item.album.images);
  if (url && url !== playback.artUrl) { playback.artUrl = url; loadTrackArt(url); }
  if (changed || restart) triggerSwap();
}

const A_BIG = 38, A_SM = 6;              // wall art / deck label art
const artState = { latest: null, failed: false };
const wallArt = { curr: null, next: null, fadeT: 1, fading: false, step: -1, masked: null };
const BAYER4 = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];

function artPal() { return CONFIG.ART_MONO ? RAMP4 : ART_COLS; }   // art stays colorized, SGB style
function buildArtPix(img) {
  const big = shrinkStepped(img, A_BIG);
  const bx = big.getContext('2d');
  const id = bx.getImageData(0, 0, A_BIG, A_BIG);
  autoLevel(id);
  sharpen(id, A_BIG, A_BIG, 0.35);
  bx.putImageData(id, 0, 0);
  const pal = CONFIG.ART_MONO ? RAMP4 : (medianCut(id, 28) || ART_COLS);
  quantizeCanvas(big, pal, true, 18);
  const sm = shrinkStepped(img, A_SM);
  quantizeCanvas(sm, pal);
  const score = c2 => {
    const mx = Math.max(c2[0], c2[1], c2[2]), mn = Math.min(c2[0], c2[1], c2[2]);
    const luma = 0.3 * c2[0] + 0.6 * c2[1] + 0.1 * c2[2];
    return (mx - mn) * (1 - Math.abs(luma - 130) / 200);
  };
  const ranked = [...pal].sort((u, v) => score(v) - score(u));
  const acc = ranked[0] || [200, 144, 16];
  let acc2 = acc;
  for (const c2 of ranked.slice(1)) {
    if (Math.abs(c2[0] - acc[0]) + Math.abs(c2[1] - acc[1]) + Math.abs(c2[2] - acc[2]) > 90) { acc2 = c2; break; }
  }
  return { big, sm, acc: 'rgb(' + acc.join(',') + ')', acc2: 'rgb(' + acc2.join(',') + ')' };
}

  const c = mk(A_BIG, A_BIG), x = c.getContext('2d');
  x.fillStyle = GB2; x.fillRect(0, 0, A_BIG, A_BIG);
  const c2 = A_BIG >> 1, r = c2 - 3;
  x.fillStyle = GB3;
  for (let dy = -r; dy <= r; dy++) {
    const dx = Math.floor(Math.sqrt(r * r - dy * dy));
    x.fillRect(c2 - dx, c2 + dy, dx * 2 + 1, 1);
  }
  x.fillStyle = GB1; x.fillRect(c2 - 3, c2 - 3, 6, 6);
  x.fillStyle = GB3; x.fillRect(c2 - 1, c2 - 1, 2, 2);
  return c;
}
function ditherMask(step) {
  const m = mk(4, 4), c = m.getContext('2d');
  c.fillStyle = '#000';
  for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) {

}

const audio = {
  mode: 'none',
  ctx: null, analyser: null, freq: null, stream: null, err: '',
  bands: { bass: 0, mid: 0, high: 0 },
  slowBass: 0.0001, wasAbove: false, lastTransient: -1e9, transient: false, transients: 0, thr: 0,
  deviceId: ls.get('djb.device') || '',
};
function stopStream() {
  if (audio.stream) { audio.stream.getTracks().forEach(t => t.stop()); audio.stream = null; }
}
async function enableAudio(deviceId, retried) {
  try {
    stopStream();
    const cs = { echoCancellation: false, noiseSuppression: false, autoGainControl: false };
    if (deviceId) cs.deviceId = { exact: deviceId };
    const stream = await navigator.mediaDevices.getUserMedia({ audio: cs });
    audio.stream = stream;
    audio.err = '';
    if (!audio.ctx) audio.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.ctx.state === 'suspended') await audio.ctx.resume();
    const src = audio.ctx.createMediaStreamSource(stream);
    audio.analyser = audio.ctx.createAnalyser();
    audio.analyser.fftSize = 2048;
    audio.analyser.smoothingTimeConstant = 0.35;
    src.connect(audio.analyser);
    audio.freq = new Uint8Array(audio.analyser.frequencyBinCount);
    audio.mode = 'mic';
    const tr = stream.getAudioTracks()[0];
    const st = (tr.getSettings && tr.getSettings()) || {};
    if (st.deviceId) { audio.deviceId = st.deviceId; ls.set('djb.device', st.deviceId); }
    tr.addEventListener('ended', () => {
      audio.mode = 'timeline';
      setMsg('Audio input ended — timeline fallback.');
      updateBar();
    });
    await populateDevices();
    setMsg('Audio input live.');
    updateBar();
  } catch (e) {
    if (e && e.name === 'OverconstrainedError' && !retried) return enableAudio('', true);
    audio.mode = 'timeline';
    audio.err = (e && e.name) || String(e);
    setMsg(audio.err === 'NotAllowedError'
      ? 'Mic permission denied — timeline fallback active.'
      : 'Audio failed (' + audio.err + ') — timeline fallback.');
    updateBar();
  }
}
async function populateDevices() {
  try {
    const devs = await navigator.mediaDevices.enumerateDevices();
    ui.devices = devs.filter(d => d.kind === 'audioinput')
      .map((d, i) => ({ id: d.deviceId, label: d.label || ('INPUT ' + (i + 1)) }));
  } catch (e) {}
}
function updateBands(dtS, nowMs) {
  audio.transient = false;
  const b = audio.bands;
  if (audio.mode === 'mic' && audio.analyser) {
    audio.analyser.getByteFrequencyData(audio.freq);
    const binHz = audio.ctx.sampleRate / audio.analyser.fftSize;
    const avg = (f0, f1) => {
      const a = Math.max(1, Math.floor(f0 / binHz));
      const z = Math.min(audio.freq.length - 1, Math.ceil(f1 / binHz));
      if (z < a) return 0;
      let s = 0;
      for (let i = a; i <= z; i++) s += audio.freq[i];
      return s / ((z - a + 1) * 255);
    };
    const rb = avg(20, 250);
    const rm = clamp01(avg(250, 4000) * 1.7);
    const rh = clamp01(avg(4000, 16000) * 2.6);
    const k = 1 - Math.exp(-dtS / CONFIG.BAND_SMOOTH_S);
    b.bass += (clamp01(rb) - b.bass) * k;
    b.mid  += (rm - b.mid) * k;
    b.high += (rh - b.high) * k;
    const ks = 1 - Math.exp(-dtS / 1.2);
    audio.slowBass += (rb - audio.slowBass) * ks;
    audio.thr = Math.max(CONFIG.TRANSIENT_FLOOR, audio.slowBass * CONFIG.TRANSIENT_SENSITIVITY);
    const above = rb > audio.thr;
    if (above && !audio.wasAbove && nowMs - audio.lastTransient > CONFIG.TRANSIENT_REFRACTORY_MS) {
      audio.transient = true;
      audio.lastTransient = nowMs;
      audio.transients++;
    }
    audio.wasAbove = above;
  } else {
    let tb = 0.08, tm = 0.08, th = 0.05;
    if (playback.isPlaying && playback.trackId) {
      const t = estProgress() / 1000;
      const beat = t * CONFIG.FALLBACK_BPM / 60, ph = beat % 1;
      const kick = Math.pow(Math.max(0, 1 - ph * 2.2), 2);
      tb = 0.22 + 0.6 * kick;
      tm = 0.3 + 0.12 * Math.sin(beat * Math.PI / 2) + 0.06 * Math.sin(t * 0.9);
      th = 0.18 + 0.14 * (((beat * 2) % 1) < 0.22 ? 1 : 0) + 0.05 * Math.sin(t * 3.1);
    }
    const k = 1 - Math.exp(-dtS / 0.08);
    b.bass += (clamp01(tb) - b.bass) * k;
    b.mid  += (clamp01(tm) - b.mid) * k;
    b.high += (clamp01(th) - b.high) * k;
    audio.thr = 0;
  }
}

function ringCirc(cx, cy, r, col) {
  p.fillStyle = col;
  let x = r, y = 0, err = 1 - r;
  while (x >= y) {
    p.fillRect(cx + x, cy + y, 1, 1); p.fillRect(cx - x, cy + y, 1, 1);
    p.fillRect(cx + x, cy - y, 1, 1); p.fillRect(cx - x, cy - y, 1, 1);
    p.fillRect(cx + y, cy + x, 1, 1); p.fillRect(cx - y, cy + x, 1, 1);
    p.fillRect(cx + y, cy - x, 1, 1); p.fillRect(cx - y, cy - x, 1, 1);
    y++;
    if (err < 0) err += 2 * y + 1; else { x--; err += 2 * (y - x) + 1; }
  }

function pxLine(x0, y0, x1, y1, col, w) {
  w = w || 1;

  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  for (let n = 0; n < 400; n++) {
    p.fillRect(x0, y0, w, w);
    if (x0 === x1 && y0 === y1) break;

    if (q.life >= q.max || q.y < 4) { particles.splice(i, 1); continue; }
    q.x += q.vx * dtS;
    q.y += q.vy * dtS;
  }
}
function drawNotes() {
  for (const q of particles) {
    if (q.kind === 2) {                                  // steam wisp, 2-frame curl
      const x = Math.round(q.x + Math.sin(q.life * q.tw + q.ph) * 1.5);
      const y = Math.round(q.y);
      p.fillStyle = GB2;
      p.fillRect(x, y, 1, 1);
      if (Math.floor(q.life * 6) % 2) p.fillRect(x + 1, y - 1, 1, 1);
      else p.fillRect(x - 1, y - 1, 1, 1);
      continue;
    }
    if (Math.sin(q.life * q.tw + q.ph) < (q.life / q.max - 0.75)) continue;
    const x = Math.round(q.x), y = Math.round(q.y);
    if (y < 41 && x > 59 && x < 100) continue;         // keep the wall art clean
    const al = artState.latest;
    p.fillStyle = al ? (q.ci === 1 ? al.acc2 : al.acc)
                     : (q.ci === 0 ? AC() : (q.ci === 1 ? GB3 : GB2));
    if (q.kind === 0) {
      p.fillRect(x, y, 2, 2);
      p.fillRect(x + 2, y - 4, 1, 6);
      p.fillRect(x + 3, y - 4, 1, 2);
    } else {
      p.fillRect(x, y, 1, 1);
    }
  }
}

/* ============================== DIALOG BOX ============================== */
function drawGBBox(x, y, w, h) {
  p.fillStyle = GB0; p.fillRect(x, y, w, h);
  p.fillStyle = GB3;
  p.fillRect(x + 2, y, w - 4, 1); p.fillRect(x + 2, y + h - 1, w - 4, 1);
  p.fillRect(x, y + 2, 1, h - 4); p.fillRect(x + w - 1, y + 2, 1, h - 4);
  p.fillRect(x + 1, y + 1, 1, 1); p.fillRect(x + w - 2, y + 1, 1, 1);
  p.fillRect(x + 1, y + h - 2, 1, 1); p.fillRect(x + w - 2, y + h - 2, 1, 1);
  p.fillStyle = GB3;                                     // heavy double border, like the reference textbox
  p.fillRect(x + 3, y + 2, w - 6, 1); p.fillRect(x + 3, y + h - 3, w - 6, 1);
  p.fillRect(x + 2, y + 3, 1, h - 6); p.fillRect(x + w - 3, y + 3, 1, h - 6);
  p.fillRect(x + 2, y + 2, 1, 1); p.fillRect(x + w - 3, y + 2, 1, 1);
  p.fillRect(x + 2, y + h - 3, 1, 1); p.fillRect(x + w - 3, y + h - 3, 1, 1);
}
function drawDialog(qT, dtS) {
  const D = L.dialog;
  drawGBBox(D.x, D.y, D.w, D.h);
  const now = performance.now();
  let l1, l2, isTrack = false;
  if (ui.msg && now < ui.msgUntil) { l1 = ui.msg.slice(0, 24); l2 = ui.msg.slice(24, 48); }
  else if (!hasTok() && !demo.on) { l1 = 'SPOTIFY NOT LINKED!'; l2 = 'CLICK TO CONNECT...'; }
  else if (!playback.trackId) { l1 = 'NOTHING PLAYING...'; l2 = 'START SPOTIFY ANYWHERE'; }
  else {
    l1 = txt('\u266a ' + playback.title, 60);
    l2 = txt(playback.artist + (playback.isPlaying ? '' : ' -PAUSED-'), 60);
    isTrack = true;
  }
  const key = l1 + '|' + l2;
  if (key !== dlg.key) { dlg.key = key; dlg.n = 0; }
  dlg.n = Math.min(l1.length + l2.length, dlg.n + 28 * dtS);   // Pokemon-style letter reveal
  const n = Math.floor(dlg.n);
  const done = n >= l1.length + l2.length;
  const tx = D.x + 7, tw = isTrack ? 106 : D.w - 14;   // text clears the control column
  if (!done) {
    drawBigText(tx, D.y + 5, l1.slice(0, n), GB3, tx, tx + tw);
    drawBigText(tx, D.y + 14, l2.slice(0, Math.max(0, n - l1.length)), GB2, tx, tx + tw);
  } else {
    drawScrollText(tx, D.y + 5, tw, l1, GB3, timeSec);
    drawScrollText(tx, D.y + 14, tw, l2, GB2, timeSec + 1.7);
  }
  if (isTrack) {
    drawTransport(D);
    if (playback.durationMs > 0) {
      const cur = clamp(estProgress(), 0, playback.durationMs);
      const fmt = ms => { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
      const tEl = txt(fmt(cur), 6), tTot = txt(fmt(playback.durationMs), 6);
      const gw = t => t.length * 4 - 1;                        // 4px advance, last glyph is 3 wide
      const SEP = 3;                                           // slash needs more than the font's 1px gap
      const tsw = gw(tEl) + SEP + 3 + SEP + gw(tTot);
      let tsx = D.x + D.w - 5 - tsw;                           // right-aligned, 2px clear of the inner border
      drawText(tsx, D.y + 21, tEl, GB2);
      tsx += gw(tEl) + SEP;
      drawText(tsx, D.y + 21, '/', GB2);
      drawText(tsx + 3 + SEP, D.y + 21, tTot, GB2);
      p.fillStyle = GB1; p.fillRect(D.x + 8, D.y + 28, 110, 2);   // 2px clear of the timer above
      const w = Math.round(clamp01(cur / playback.durationMs) * 110);
      const al = artState.latest;
      p.fillStyle = al ? al.acc : AC();
      p.fillRect(D.x + 8, D.y + 28, w, 2);
    }
  }
}
const TR_BTNS = [
  { id: 'prev', x: 118, y: 4 },
  { id: 'play', x: 130, y: 4 },
  { id: 'next', x: 142, y: 4 },
];
function drawTransport(D) {
  for (const b of TR_BTNS) {
    const bx = D.x + b.x, by = D.y + b.y;
    p.fillStyle = GB3; p.fillRect(bx, by, 10, 10);
    p.fillStyle = GB0; p.fillRect(bx + 1, by + 1, 8, 8);
    p.fillStyle = GB2; p.fillRect(bx + 1, by + 8, 8, 1);
    p.fillStyle = GB3;
    if (b.id === 'prev') {
      p.fillRect(bx + 2, by + 3, 1, 4);
      p.fillRect(bx + 5, by + 4, 1, 2); p.fillRect(bx + 4, by + 4, 1, 2); p.fillRect(bx + 6, by + 3, 1, 4);
    } else if (b.id === 'play') {
      if (playback.isPlaying) { p.fillRect(bx + 3, by + 3, 2, 4); p.fillRect(bx + 6, by + 3, 2, 4); }
      else { p.fillRect(bx + 3, by + 3, 1, 4); p.fillRect(bx + 4, by + 3, 2, 3); p.fillRect(bx + 6, by + 4, 1, 2); }
    } else {
      p.fillRect(bx + 7, by + 3, 1, 4);
      p.fillRect(bx + 4, by + 4, 1, 2); p.fillRect(bx + 5, by + 4, 1, 2); p.fillRect(bx + 3, by + 3, 1, 4);
    }
  }
}
async function transport(cmd) {
  const at = await getAccessToken();
  if (!at) return;
  const map = {
    prev: ['POST', 'https://api.spotify.com/v1/me/player/previous'],
    next: ['POST', 'https://api.spotify.com/v1/me/player/next'],
    play: ['PUT', 'https://api.spotify.com/v1/me/player/' + (playback.isPlaying ? 'pause' : 'play')],
  };
  const [m, url] = map[cmd];
  try {
    let r = await fetch(url, { method: m, headers: { Authorization: 'Bearer ' + at } });
    if (r.status === 401 && await refreshToken()) {
      r = await fetch(url, { method: m, headers: { Authorization: 'Bearer ' + ls.get('djb.at') } });
    }
    if (r.status === 403) {
      const body = await r.text();
      if (/PREMIUM/i.test(body)) setMsg('SPOTIFY PREMIUM NEEDED FOR CONTROLS');
      else { clearAuth(); setMsg('RECONNECT TO ENABLE CONTROLS'); }
      return;
    }
    if (r.ok || r.status === 204) {
      if (cmd === 'play') playback.isPlaying = !playback.isPlaying;
      setTimeout(() => { try { pollNow(); } catch (e) {} }, 400);
    }
  } catch (e) {}
}
function drawBubble(bx, by, ch) {         // Pokemon-style emote balloon
  p.fillStyle = GB3; p.fillRect(bx - 1, by - 1, 11, 11);
  p.fillStyle = GB0; p.fillRect(bx, by, 9, 9);
  p.fillStyle = GB3;
  p.fillRect(bx - 1, by - 1, 1, 1); p.fillRect(bx + 9, by - 1, 1, 1);
  p.fillRect(bx - 1, by + 9, 1, 1); p.fillRect(bx + 9, by + 9, 1, 1);
  p.fillRect(bx + 3, by + 10, 2, 1); p.fillRect(bx + 4, by + 11, 1, 1);   // tail
  drawText(bx + 3, by + 2, ch, GB3);
}
function drawDeviceMenu() {
  if (!ui.menuOpen) return;
  const g = menuGeom();
  drawGBBox(g.x, g.y, g.w, g.h);
  drawText(g.x + 5, g.y + 4, 'AUDIO INPUT', GB2);
  const total = ui.devices.length + 1;
  for (let r = 0; r < g.rows; r++) {
    const label = r < ui.devices.length ? txt(ui.devices[r].label, 17) : 'CANCEL';
    const ry = g.y + 13 + r * 10;
    drawBigText(g.x + 12, ry, label, r < ui.devices.length ? GB3 : GB2, g.x + 12, g.x + g.w - 6);
    if (r === Math.min(ui.menuIdx, total - 1)) {
      p.fillStyle = GB3;
      p.fillRect(g.x + 5, ry + 1, 1, 5);
      p.fillRect(g.x + 6, ry + 2, 1, 3);
      p.fillRect(g.x + 7, ry + 3, 1, 1);
    }
    if (r < ui.devices.length && ui.devices[r].id === audio.deviceId) {
      p.fillStyle = GB2; p.fillRect(g.x + g.w - 10, ry + 2, 3, 1); p.fillRect(g.x + g.w - 9, ry + 3, 1, 1);
    }
  }
}

/* ============================== DEBUG OVERLAY ============================== */
let debugOn = CONFIG.DEBUG_START, lastMsg = '';
let fps = 0, fpsN = 0, fpsT = performance.now();
function fmtT(ms) {
  ms = Math.max(0, ms | 0);
  const s = Math.floor(ms / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
function drawDebug() {
  if (!debugOn) return;
  ctx.setTransform(dprFac, 0, 0, dprFac, 0, 0);
  ctx.fillStyle = 'rgba(5,7,10,0.82)';
  ctx.fillRect(12, 12, 404, 212);
  ctx.fillStyle = '#cfd6e2';
  ctx.font = '13px ui-monospace,Menlo,monospace';
  ctx.textBaseline = 'top';
  let y = 22;
  const line = s => { ctx.fillText(s, 24, y); y += 17; };
  const meter = (label, v) => {
    ctx.fillText(label, 24, y);
    ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(68, y + 2, 140, 9);
    ctx.fillStyle = '#e0b040'; ctx.fillRect(68, y + 2, 140 * clamp01(v), 9);
    ctx.fillStyle = '#cfd6e2'; ctx.fillText(v.toFixed(2), 216, y);
    y += 17;
  };
  line('fps ' + fps.toFixed(1) + '   x' + intScale + '   audio ' + audio.mode + (audio.ctx ? ' @' + audio.ctx.sampleRate + 'Hz' : ''));
  line('state ' + dj.state + ' t' + dj.t.toFixed(2) + '   deck ' + (decks.active === 0 ? 'A' : 'B')
    + '   scratch in ' + Math.max(0, (dj.nextScratchAt - performance.now()) / 1000).toFixed(0) + 's');
  meter('bass', audio.bands.bass);
  meter('mid', audio.bands.mid);
  meter('high', audio.bands.high);
  line('transients ' + audio.transients + '   thr ' + audio.thr.toFixed(2));
  line('poll ' + poll.last.status + '   next in ' + Math.max(0, (poll.nextAt - Date.now()) / 1000).toFixed(1) + 's');
  line(String(poll.last.text).slice(0, 52));
  line(playback.trackId ? fmtT(estProgress()) + ' / ' + fmtT(playback.durationMs) : 'no track');
  if (lastMsg) line('msg: ' + lastMsg.slice(0, 48));
}

/* ============================== UI CHROME (all in-game, GB style) ============================== */
function hasTok() { return !!(ls.get('djb.rt') || ls.get('djb.at')); }

/* ============================== DEMO MODE ============================== */
// ?demo runs the room with invented tracks and no Spotify at all: no account,
// no client id, no allowlist. Real playback always wins if a token exists.
const DEMO_TRACKS = [
  ['NEON ARCADE', 'PIXEL DRIFT'], ['MIDNIGHT LOOP', 'CASSETTE CLUB'],
  ['SLOW SUNRISE', 'TAPE HISS'], ['GHOST IN THE MIX', 'DUB SIGNAL'],
  ['LATE TRANSFER', 'ROOM TONE'], ['PAPER LANTERNS', 'SOFT STATIC'],
];
const demo = { on: /[?&]demo\b/i.test(location.search), i: -1, next: 0 };
function demoTick(now) {
  if (!demo.on || hasTok()) return;
  if (now < demo.next) return;
  demo.i = (demo.i + 1) % DEMO_TRACKS.length;
  const t = DEMO_TRACKS[demo.i], dur = 165000 + Math.floor(Math.random() * 90000);
  onPlayback({
    is_playing: true, progress_ms: 0, currently_playing_type: 'track',
    item: { id: 'demo-' + demo.i, name: t[0], artists: [{ name: t[1] }], duration_ms: dur, album: { images: [] } },
  });
  demo.next = now + Math.min(dur, 42000);           // swap decks every 42s at most
}
function setMsg(t) {                      // messages appear in the dialog box, Pokemon style
  lastMsg = t || '';
  ui.msg = txt(t || '', 50);
  ui.msgUntil = performance.now() + 3500;
}
function updateBar() {}                   // chrome is drawn in-canvas now
function showSetup() {
  inClient.value = getClientId();
  ruri.textContent = CONFIG.REDIRECT_URI;
  setup.style.display = 'grid';
}
function hideSetup() { setup.style.display = 'none'; }

btnSave.addEventListener('click', () => {
  const v = inClient.value.trim();
  if (!v) { inClient.focus(); return; }
  ls.set('djb.cid', v);
  hideSetup();
  beginAuth();
});
btnCancel.addEventListener('click', hideSetup);
btnReset.addEventListener('click', () => {
  clearAuth();
  ls.del('djb.cid');
  setMsg('SPOTIFY AUTH CLEARED');
  hideSetup();
});
function canvasPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: Math.floor((e.clientX - r.left) * PW / r.width), y: Math.floor((e.clientY - r.top) * PH / r.height) };
}
const inRect = (pt, x, y, w, h) => pt.x >= x && pt.x < x + w && pt.y >= y && pt.y < y + h;
async function openAudioMenu() {
  if (audio.mode !== 'mic') await enableAudio(audio.deviceId || '');
  await populateDevices();
  if (audio.mode === 'mic' && ui.devices.length) {
    ui.menuOpen = true;
    ui.menuIdx = Math.max(0, ui.devices.findIndex(d => d.id === audio.deviceId));
  }
}
function menuGeom() {
  const rows = Math.min(ui.devices.length + 1, 7);
  return { x: 16, y: 30, w: 128, h: 15 + rows * 10, rows };
}
function menuRowAt(pt) {
  const g = menuGeom();
  if (!inRect(pt, g.x, g.y, g.w, g.h)) return -2;
  const r = Math.floor((pt.y - g.y - 13) / 10);
  return (r >= 0 && r < g.rows) ? r : -1;
}
cv.addEventListener('click', e => {
  const pt = canvasPos(e);
  if (ui.menuOpen) {
    const r = menuRowAt(pt);
    if (r === -2 || r === ui.devices.length) { ui.menuOpen = false; return; }
    if (r >= 0 && ui.devices[r]) { ui.menuOpen = false; enableAudio(ui.devices[r].id); }
    return;
  }
  if (!hasTok()) {
    if (!getClientId()) showSetup(); else beginAuth();
    return;
  }
  if (playback.trackId) {
    for (const b of TR_BTNS) {
      if (inRect(pt, L.dialog.x + b.x, L.dialog.y + b.y, 10, 10)) { transport(b.id); return; }
    }
  }
  for (const s of L.speakers) {
    if (inRect(pt, s.x - 1, s.y - 1, 14, 18)) { openAudioMenu(); return; }
  }
});
addEventListener('keydown', e => {
  if (e.target && /^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if (k === 'f') { toggleFullscreen(); e.preventDefault(); return; }
  if (ui.menuOpen) {
    if (k === 'arrowup') ui.menuIdx = (ui.menuIdx + ui.devices.length) % (ui.devices.length + 1);
    else if (k === 'arrowdown') ui.menuIdx = (ui.menuIdx + 1) % (ui.devices.length + 1);
    else if (k === 'enter') {
      const d = ui.devices[ui.menuIdx];
      ui.menuOpen = false;
      if (d) enableAudio(d.id);
    } else if (k === 'escape') ui.menuOpen = false;
    e.preventDefault();
    return;
  }
  if (k === 's') triggerSwap();
  else if (k === 'r') triggerScratch(true);
  else if (k === 'd') debugOn = !debugOn;
  else if (k === 'a') openAudioMenu();
  else if (k === ' ') { transport('play'); e.preventDefault(); }
  else if (k === 'arrowright') { transport('next'); e.preventDefault(); }
  else if (k === 'arrowleft') { transport('prev'); e.preventDefault(); }
});
document.addEventListener('click', () => {
  if (audio.ctx && audio.ctx.state === 'suspended') audio.ctx.resume();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) schedulePoll(250); });
if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
  navigator.mediaDevices.addEventListener('devicechange', populateDevices);
}

/* ============================== MAIN LOOP + BOOT ============================== */
let lastT = performance.now(), timeSec = 0;
function frame(now) {
  const dtS = clamp((now - lastT) / 1000, 0, 0.05);
  lastT = now;
  timeSec = now / 1000;
  const qT = Math.floor(timeSec * CONFIG.ANIM_FPS) / CONFIG.ANIM_FPS;
  fpsN++;
  if (now - fpsT >= 500) { fps = fpsN * 1000 / (now - fpsT); fpsN = 0; fpsT = now; }
  const ka = 1 - Math.exp(-dtS / 0.4);
  for (let i = 0; i < 3; i++) accent.cur[i] += (accent.tgt[i] - accent.cur[i]) * ka;
  updateBands(dtS, now);
  demoTick(now);
  updateDJ(dtS, now);
  updatePlatters(dtS);
  updateAgents(dtS, now);
  updateNotes(dtS);
  // ---- scene (160x144) ----
  p.setTransform(1, 0, 0, 1, 0, 0);
  p.drawImage(roomCv, 0, 0);
  drawBoardArt(dtS);
  drawWallSpeakers();
  drawDeck(0);
  drawDeck(1);
  drawMixer();
  drawGlow();
  drawLEDs(qT);
  drawDJ(qT);
  drawCrowd(qT, now);
  drawNotes();
  drawDialog(qT, dtS);
  drawDeviceMenu();
  // ---- upscale (nearest neighbor) ----
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#181410';
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(px, 0, 0, cv.width, cv.height);
  if (gridCv) ctx.drawImage(gridCv, 0, 0);
  drawDebug();
  requestAnimationFrame(frame);
}
(async function boot() {
  buildRoom();
  await handleRedirect();
  updateBar();
  schedulePoll(0);
  try {
    const st = await navigator.permissions.query({ name: 'microphone' });
    if (st.state === 'granted' && audio.deviceId) enableAudio(audio.deviceId);
  } catch (e) {}
  requestAnimationFrame(frame);
})();
